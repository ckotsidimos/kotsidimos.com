<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CV | Christos Kotsidimos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Executive technology leadership, enterprise transformation, and operating model design under uncertainty.">
    <link rel="canonical" href="https://kotsidimos.com/pages/cv.html" />
    <meta property="og:title" content="Christos Kotsidimos" />
    <meta property="og:description" content="Technology executive and author of The Kinetic Enterprise." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kotsidimos.com" />
    <meta property="og:image" content="https://kotsidimos.com/assets/og-image.png" />
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E83FDPZX1T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-E83FDPZX1T');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            scroll-behavior: smooth;
        }

        .kinetic-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .mosaic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .mosaic-tile {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.5);
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .mosaic-tile:hover {
            border-color: #3b82f6;
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.8);
        }

        .mosaic-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #3b82f6;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mosaic-tile:hover::before {
            opacity: 1;
        }

        .hero-text {
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .factory-contrast {
            border-left: 2px solid #ef4444;
        }
        .kinetic-contrast {
            border-left: 2px solid #3b82f6;
        }
    </style>
</head>

<body>
<!-- NAV -->
<nav class="glass-nav fixed w-full z-50 py-4">
    <div class="container mx-auto px-6 flex justify-between items-center">
        <div class="text-xl font-800 tracking-tighter uppercase">
            <a href="/index.html" class="hover:text-slate-200">
            Christos Kotsidimos<span class="text-blue-500"></a></span>
        </div>

        <div class="hidden md:flex space-x-8 text-sm font-semibold text-slate-400">
            <a href="/index.html" class="hover:text-slate-200">Home</a>
            <a href="/pages/work.html" class="hover:text-white">Work</a>
            <a href="/pages/cv.html" class="hover:text-white">CV</a>
            <a href="/pages/contact.html" class="hover:text-white">Contact</a>
        </div>

        <a href="https://github.com/ckotsidimos/kinetic-enterprise" target="_blank"
           class="text-xl hover:text-blue-500 transition">
            <i class="fab fa-github"></i>
        </a>
    </div>
</nav>

<!-- HERO -->
<header class="min-h-[50vh] flex items-center pt-20 kinetic-gradient border-b border-slate-900">
    <div class="container mx-auto px-6">
        <div class="max-w-4xl">
            <h1 class="text-5xl md:text-7xl font-800 hero-text mb-6">
                Curriculum Vitae
            </h1>

            <p id="summary" class="text-xl text-slate-400 leading-relaxed max-w-3xl">
            </p>

            <div id="contact" class="flex flex-wrap gap-3 mt-6"></div>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="py-24">
    <div class="container mx-auto px-6 max-w-4xl space-y-24">

        <!-- EXPERIENCE -->
        <section>
            <h2 class="text-sm font-bold uppercase tracking-widest text-blue-500 mb-10">
                Professional Experience
            </h2>
            <div id="work" class="relative border-l border-slate-800 ml-4 space-y-12"></div>
        </section>

        <!-- STRATEGIC VECTORS -->
        <section class="grid md:grid-cols-2 gap-16">
            <div>
                <h2 class="text-sm font-bold uppercase tracking-widest text-blue-500 mb-8">
                    Strategic Vectors
                </h2>
                <div id="vectors" class="space-y-8"></div>
            </div>

            <div>
                <h2 class="text-sm font-bold uppercase tracking-widest text-blue-500 mb-8">
                    Foundations & Credentials
                </h2>
                <div id="education" class="space-y-6 mb-10"></div>
                <div id="certificates" class="space-y-3"></div>
            </div>
        </section>

    </div>
</main>

<footer class="py-16 border-t border-slate-900 text-center text-slate-500 text-sm">
    © Christos Kotsidimos
</footer>

<!-- SCRIPT -->
<script>
fetch('cv.json')
    .then(res => res.json())
    .then(data => {

        // Summary
        document.getElementById('summary').innerText = data.basics.summary;

        // Contact
        const contact = document.getElementById('contact');
        contact.innerHTML = `
            <span class="status-pill px-3 py-1 text-xs font-bold rounded-full">${data.basics.location.city}, UK</span>
            <span class="status-pill px-3 py-1 text-xs font-bold rounded-full">${data.basics.email}</span>
        `;

        // Experience
        const workContainer = document.getElementById('work');
        data.work.forEach(job => {
            const div = document.createElement('div');
            div.className = "relative pl-8";

            div.innerHTML = `
                <div class="timeline-dot"></div>
                <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-2">
                    <div>
                        <h3 class="text-xl font-bold">${job.position}</h3>
                        <p class="text-blue-400 font-semibold">${job.name}</p>
                    </div>
                    <span class="text-sm text-slate-500 font-mono">
                        ${job.startDate?.split('-')[0]} — ${job.endDate ? job.endDate.split('-')[0] : 'Present'}
                    </span>
                </div>
                <p class="text-slate-400 mb-4 text-sm">${job.summary || ''}</p>
                <ul class="space-y-2">
                    ${job.highlights.map(h => `<li class="text-slate-500 text-sm flex items-start"><span class="text-blue-500 mr-2">▹</span>${h}</li>`).join('')}
                </ul>
            `;
            workContainer.appendChild(div);
        });

        // Strategic Vectors
        const vectorsContainer = document.getElementById('vectors');
        data.strategicVectors.forEach(vector => {
            const div = document.createElement('div');
            div.innerHTML = `
                <h4 class="font-bold text-white mb-3">${vector.category}</h4>
                <div class="flex flex-wrap gap-2">
                    ${vector.items.map(i => `<span class="text-[10px] uppercase tracking-wider font-800 text-slate-400 border border-slate-800 px-2 py-1">${i}</span>`).join('')}
                </div>
            `;
            vectorsContainer.appendChild(div);
        });

        // Education
        const eduContainer = document.getElementById('education');
        data.education.forEach(edu => {
            const div = document.createElement('div');
            div.innerHTML = `
                <p class="text-xs font-bold text-blue-500 uppercase tracking-wider">${edu.studyType}</p>
                <h4 class="font-bold">${edu.area}</h4>
                <p class="text-slate-500 text-sm">${edu.institution}</p>
            `;
            eduContainer.appendChild(div);
        });

        // Certificates
        const certContainer = document.getElementById('certificates');
        data.certificates.forEach(cert => {
            const div = document.createElement('div');
            div.className = "flex items-center space-x-3 text-slate-400 text-sm";
            div.innerHTML = `<i class="fas fa-certificate text-blue-500 text-xs"></i><span>${cert.name}</span>`;
            certContainer.appendChild(div);
        });

    });
</script>
<!-- Reveal Animation -->
    <script>
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
